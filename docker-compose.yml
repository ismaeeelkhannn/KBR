# Khan Burger - local development database
# This file runs PostgreSQL only. Run the Next.js app separately with Node.
services:
  postgres:
    image: postgres:16-alpine
    container_name: kbr_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Karachi
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - kbr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kbr_pgdata:
    name: kbr_pgdata
